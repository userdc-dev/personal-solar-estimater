name: Build SolarCast APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test forecast model
        run: node tests/engine.test.js
      - name: Build installable test APK
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SolarCast-1.0.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SolarCast-APK
          path: SolarCast-1.0.0-test.apk
