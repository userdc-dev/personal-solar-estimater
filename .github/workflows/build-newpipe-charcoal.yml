name: Build NewPipe Charcoal APK

on:
  push:
    branches:
      - newpipe-charcoal-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-newpipe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout official NewPipe 0.29.1
        uses: actions/checkout@v4
        with:
          repository: TeamNewPipe/NewPipe
          ref: v0.29.1
          fetch-depth: 1

      - name: Set local variant branch
        run: git switch -c charcoal-gestures

      - name: Change YouTube header from red to charcoal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/res/values/colors_services.xml")
          text = path.read_text()
          replacements = {
              '<color name="light_youtube_primary_color">#e53935</color>':
                  '<color name="light_youtube_primary_color">#252525</color>',
              '<color name="dark_youtube_primary_color">#992722</color>':
                  '<color name="dark_youtube_primary_color">#202020</color>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected colour not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          header = Path("app/src/main/res/layout/drawer_header.xml")
          h = header.read_text()
          if 'android:src="@drawable/background_header"' not in h:
              raise SystemExit("Expected header graphic reference not found")
          header.write_text(h.replace('android:src="@drawable/background_header"', 'android:src="@android:color/transparent"'))
          print("Red colours and patterned header removed; replaced with charcoal")
          PY


      - name: Add centre swipe gestures to main video player
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error "https://raw.githubusercontent.com/userdc-dev/personal-solar-estimater/newpipe-charcoal-build/newpipe/patch_gestures.py" -o "$RUNNER_TEMP/patch_gestures.py"
          python3 "$RUNNER_TEMP/patch_gestures.py"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK tools and Android 37
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/newpipe-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --silent --show-error "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/commandlinetools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/commandlinetools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/newpipe-cli-unpack"
          mv "$RUNNER_TEMP/newpipe-cli-unpack/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --list_installed

      - name: Build signed continuous APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleContinuous --no-daemon --stacktrace

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-0.29.1-Charcoal-Gestures-APK
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 30
