name: Build NewPipe Charcoal APK

on:
  push:
    branches:
      - newpipe-charcoal-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-newpipe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout official NewPipe 0.29.1
        uses: actions/checkout@v4
        with:
          repository: TeamNewPipe/NewPipe
          ref: v0.29.1
          fetch-depth: 1

      - name: Set local variant branch
        run: git switch -c charcoal-gestures

      - name: Change YouTube header from red to charcoal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/res/values/colors_services.xml")
          text = path.read_text()
          replacements = {
              '<color name="light_youtube_primary_color">#e53935</color>':
                  '<color name="light_youtube_primary_color">#252525</color>',
              '<color name="dark_youtube_primary_color">#992722</color>':
                  '<color name="dark_youtube_primary_color">#202020</color>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected colour not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          header = Path("app/src/main/res/layout/drawer_header.xml")
          h = header.read_text()
          if 'android:src="@drawable/background_header"' not in h:
              raise SystemExit("Expected header graphic reference not found")
          header.write_text(h.replace('android:src="@drawable/background_header"', 'android:src="@android:color/transparent"'))
          print("Red colours and patterned header removed; replaced with charcoal")
          PY


      - name: Add centre swipe gestures to main video player
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gesture = Path("app/src/main/java/org/schabi/newpipe/player/gesture/MainPlayerGestureListener.kt")
          source = gesture.read_text()

          def replace_once(old, new):
              global source
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one gesture anchor; found {source.count(old)}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
              "    private var isMoving = false\n",
              """    private var isMoving = false
    private var swipeStartX = 0f
    private var swipeStartY = 0f
    private var canToggleFullscreenOnSwipe = false
"""
          )

          replace_once(
              """        super.onTouch(v, event)
        if (event.action == MotionEvent.ACTION_UP && isMoving) {
            isMoving = false
            onScrollEnd(event)
        }
        return when (event.action) {""",
              """        // Only the centre of the video is used for fullscreen swipes.
        // Preserve left/right brightness and volume sliders and double-tap seeking.
        when (event.actionMasked) {
            MotionEvent.ACTION_DOWN -> {
                swipeStartX = event.x
                swipeStartY = event.y
                canToggleFullscreenOnSwipe =
                    getDisplayPortion(event) == DisplayPortion.MIDDLE &&
                        !isDoubleTapping && !playerUi.isSomePopupMenuVisible
            }
            MotionEvent.ACTION_POINTER_DOWN -> canToggleFullscreenOnSwipe = false
        }

        super.onTouch(v, event)

        if (event.actionMasked == MotionEvent.ACTION_UP) {
            val verticalTravel = event.y - swipeStartY
            val horizontalTravel = abs(event.x - swipeStartX)
            val swipeThreshold = 64f * v.resources.displayMetrics.density
            val isFullScreenSwipe =
                canToggleFullscreenOnSwipe &&
                    !isDoubleTapping &&
                    abs(verticalTravel) >= swipeThreshold &&
                    abs(verticalTravel) > horizontalTravel * 1.4f &&
                    (if (playerUi.isFullscreen) verticalTravel > 0f else verticalTravel < 0f)
            canToggleFullscreenOnSwipe = false
            if (isMoving) {
                isMoving = false
                onScrollEnd(event)
            }
            if (isFullScreenSwipe) {
                // Uses NewPipe's existing fullscreen/orientation handling.
                playerUi.toggleFullscreen()
                return true
            }
        } else if (event.actionMasked == MotionEvent.ACTION_CANCEL) {
            canToggleFullscreenOnSwipe = false
            isMoving = false
        }

        return when (event.action) {"""
          )

          replace_once(
              """        if (initialEvent == null || !playerUi.isFullscreen) {
            return false
        }

        // Calculate heights of status and navigation bars""",
              """        if (initialEvent == null) {
            return false
        }

        // Centre swipes are reserved for expanding/collapsing fullscreen;
        // do not change brightness or volume while doing these gestures.
        if (getDisplayPortion(initialEvent) == DisplayPortion.MIDDLE) {
            if (abs(movingEvent.y - initialEvent.y) > MOVEMENT_THRESHOLD) {
                isMoving = true
            }
            return true
        }

        if (!playerUi.isFullscreen) {
            return false
        }

        // Calculate heights of status and navigation bars"""
          )

          gesture.write_text(source)

          # A distinct Android application id avoids clashes with previously
          # installed Charcoal builds, which use different signing certificates.
          gradle = Path("app/build.gradle.kts")
          gradle_source = gradle.read_text()
          needle = 'resValue("string", "app_name", "NewPipe $workingBranch")'
          if gradle_source.count(needle) != 2:
              raise SystemExit("Expected two app-name variants")
          gradle.write_text(gradle_source.replace(needle,
              'resValue("string", "app_name", "NewPipe Charcoal")'))
          print("Centre swipe up/down gesture patch applied successfully.")
          PY

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK tools and Android 37
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/newpipe-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --silent --show-error "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/commandlinetools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/commandlinetools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/newpipe-cli-unpack"
          mv "$RUNNER_TEMP/newpipe-cli-unpack/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --list_installed

      - name: Build signed continuous APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleContinuous --no-daemon --stacktrace

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-0.29.1-Charcoal-Gestures-APK
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 30
